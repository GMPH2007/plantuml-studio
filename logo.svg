<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado moderno con sombra -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#bgGrad)" />
  <rect x="7" y="7" width="86" height="86" rx="21" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Nodos y Conexiones en forma de 'P' de PlantUML -->
  <g filter="url(#glow)">
    <!-- Tronco vertical de la P -->
    <line x1="32" y1="28" x2="32" y2="72" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Arco de la P (diagrama conectado) -->
    <path d="M 32 28 C 58 28, 68 34, 68 46 C 68 58, 56 64, 32 64" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Flechas y enlaces internos de diagrama -->
    <line x1="32" y1="46" x2="52" y2="46" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="3,3" />

    <!-- Nodos del diagrama (círculos interactivos) -->
    <circle cx="32" cy="28" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="32" cy="46" r="5" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
    <circle cx="32" cy="72" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="68" cy="46" r="6.5" fill="#a855f7" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="52" cy="46" r="4" fill="#ffffff" />
  </g>
</svg>
